<div class="container">
  <h2>Integer to Roman Numeral Converter</h2>

  <div class="input-group">
    <label for="numberInput">Enter an integer (1-3999):</label>
    <input
      id="numberInput"
      type="number"
        [(ngModel)]="this.inputNumber"
      (keyup.enter)="convertToRoman()"
      placeholder="Enter a number"
      class="input-field"
    />
    <button (click)="convertToRoman()" class="convert-btn">Convert</button>
  </div>
  @if(this.errorMessage) {
    <div class="error-message">
        {{ errorMessage }}
    </div>
  }
  
  @if(this.romanNumeral) {
    <fieldset class="result">
      <legend class="result-label">Roman Numeral:</legend>
      <p class="result-value">{{ this.romanNumeral }}</p>
    </fieldset>
  }
<table>
    <thead>
        <tr>
            <th>Arabic Value</th>
            <th>Roman Numeral</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>1</td>
            <td>I</td>
        </tr>
         <tr>
            <td>5</td>
            <td>V</td>
        </tr>
         <tr>
            <td>10</td>
            <td>X</td>
        </tr>
         <tr>
            <td>50</td>
            <td>L</td>
        </tr>
        <tr>
            <td>100</td>
            <td>C</td>
        </tr>
         <tr>
            <td>500</td>
            <td>D</td>
        </tr>
         <tr>
            <td>1000</td>
            <td>M</td>
        </tr>
    </tbody>
</table>
</div>
