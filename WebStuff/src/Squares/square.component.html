<div class="container">
  <h2>Square ASCII Art Generator</h2>

  <div class="control-group">
    <p class="center-text">
      <select [(ngModel)]="selectedSize" class="dropdown">
        @for (size of sizes; track size) {
            <option [value]="size">{{ size }}</option>
        }
      </select>
      <a (click)="generateBlocks()" class="generate-btn">Generate</a>
    </p>
     
  </div>
@if(this.squareArt){
<div class="result center-text">
    <pre >{{ squareArt }}</pre>
  </div>
}
  
</div>
