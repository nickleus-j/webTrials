<div class="container">
  <h2>Diamond ASCII Art Generator</h2>

  <div class="control-group">
      <select [(ngModel)]="selectedSize" class="dropdown">
        @for (size of sizes; track size) {
            <option [value]="size">{{ size }}</option>
        }
      </select>
      <button (click)="generateDiamond()" class="generate-btn">Generate</button>
  </div>
@if(this.diamondArt){
<div class="result">
    <pre >{{ diamondArt }}</pre>
  </div>
}
  
</div>
