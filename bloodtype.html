      "can_receive_from": ["O-", "O+", "A-", "A+", "B-", "B+", "AB-", "AB+"]
    }
  ]
}
function generateBloodTypeTable(jsonData) {
    const container = document.createElement('div');
    container.className = 'blood-compatibility-container';

    const title = document.createElement('h1');
    title.className = 'blood-compatibility-title';
    title.textContent = '🩸 Blood Type Compatibility Chart';
    container.appendChild(title);

    const donateTitle = document.createElement('h2');
    donateTitle.className = 'blood-compatibility-section-title';
    donateTitle.textContent = 'Can Donate To';
    container.appendChild(donateTitle);

    const donateTable = createTable(jsonData.blood_compatibility, 'can_donate_to', 'O-');
    container.appendChild(donateTable);

    const receiveTitle = document.createElement('h2');
    receiveTitle.className = 'blood-compatibility-section-title';
    receiveTitle.textContent = 'Can Receive From';
    container.appendChild(receiveTitle);

    const receiveTable = createTable(jsonData.blood_compatibility, 'can_receive_from', 'AB+');
    container.appendChild(receiveTable);

    return container;
}

function createTable(data, property, specialType) {
    const table = document.createElement('table');
    table.className = 'blood-compatibility-table';

    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');

    const th1 = document.createElement('th');
    th1.textContent = 'Blood Type';

    const th2 = document.createElement('th');
    th2.textContent = property.replaceAll('_', ' ');
    th2.textContent = th2.textContent.replace(/([a-z])([A-Z])/g, '$1 $2');

    headerRow.appendChild(th1);
    headerRow.appendChild(th2);
    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    data.forEach(item => {
        const row = document.createElement('tr');

        const typeCell = document.createElement('td');
        typeCell.className = 'blood-type-cell';
        typeCell.textContent = item.blood_type;

        const compatCell = document.createElement('td');

        const badgesDiv = document.createElement('div');
        badgesDiv.className = 'blood-badges';

        item[property].forEach(type => {
            const badge = document.createElement('span');
            badge.className = 'blood-badge';
            badge.textContent = type;
            badgesDiv.appendChild(badge);
        });

        compatCell.appendChild(badgesDiv);

        if (item.blood_type === specialType) {
            const label = document.createElement('p');
            label.className = 'blood-universal-label';
            label.textContent = specialType === 'O-' ? '✓ Universal Donor' : '✓ Universal Recipient';
            compatCell.appendChild(label);
        }

        row.appendChild(typeCell);
        row.appendChild(compatCell);
        tbody.appendChild(row);
    });

    table.appendChild(tbody);
    return table;
}
const table = generateBloodTypeTable(bloodCompatability);
window.addEventListener('load', () => {
    document.body.appendChild(table);
});
